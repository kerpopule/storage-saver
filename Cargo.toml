[package]
name = "storage-atlas"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Private, local-first storage observatory for people and agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
libc = "0.2"
tiny_http = "0.12"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
